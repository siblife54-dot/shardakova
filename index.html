      <section class="nastya-quote" aria-label="Обращение Насти Шардаковой">
        <figure class="nastya-quote-card">
          <blockquote class="nastya-quote-text">
            <p class="nastya-quote-opening">Три года я вела<br>клуб «Шарм»</p>
            <p>И я решила собрать <strong>лучшие тренировки</strong> в&nbsp;отдельную коллекцию</p>
            <p class="nastya-quote-thought">Чтобы ты могла взять <em>именно то, что<br class="quote-thought-break"> нужно тебе сейчас.</em></p>
            <p>Возможно, тебе хочется накачать ягодицы, выровнять осанку, убрать боли в&nbsp;спине, сделать живот более плоским или убрать отечность.</p>
          </blockquote>
          <figcaption class="nastya-quote-author">
            <img src="./photo/hero/portrait-240.webp" width="44" height="44" loading="lazy" alt="">
            <span>Настя Шардакова</span>

        </figure>
