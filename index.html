  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title" class="visually-hidden">Самые эффективные тренировки от Насти Шардаковой</h1>
        <picture class="hero-picture">
          <source srcset="./assets/hero-final.webp" type="image/webp">
          <img class="hero-image" src="./assets/hero-final.png"
            width="941" height="1671" loading="eager" fetchpriority="high"
            alt="Настя Шардакова. Распродажа 11.11: специальные цены до 18 ноября. Доступ 2 месяца. Тренировки для дома и зала.">
        </picture>
        <a class="hero-cta" href="#plans">

      <section class="nastya-quote" aria-label="Обращение Насти Шардаковой">
        <figure class="nastya-quote-card">
          <blockquote class="nastya-quote-text">
            <p class="nastya-quote-opening">Три года я вела<br>клуб «Шарм»</p>
            <p>И я решила собрать <strong>лучшие тренировки</strong> в&nbsp;отдельную коллекцию</p>
            <p class="nastya-quote-thought">Чтобы ты могла взять <em>именно то, что<br class="quote-thought-break"> нужно тебе сейчас.</em></p>
            <p>Возможно, тебе хочется накачать ягодицы, выровнять осанку, убрать боли в&nbsp;спине, сделать живот более плоским или убрать отечность.</p>
          </blockquote>
          <figcaption class="nastya-quote-author">
            <img src="./photo/hero/portrait-240.webp" width="44" height="44" loading="lazy" alt="">
            <span>Настя Шардакова</span>
          </figcaption>
        </figure>
      </section>

      <section class="plans-section container" id="plans" aria-labelledby="plans-title">
        <h2 id="plans-title">Тарифы</h2>
        <div class="plans" id="plans-list"></div>
        <noscript>
          <p>Для просмотра тарифов и перехода к оплате включите JavaScript в браузере.</p>
